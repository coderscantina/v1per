[package]
name = "v1per-notify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
lettre = { version = "0.11", default-features = false, features = ["builder", "dkim", "hostname", "ring", "smtp-transport", "tokio1-rustls", "webpki-roots"] }
liquid-core = "0.26"
liquid-lib = { version = "0.26", features = ["stdlib"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "rustls-no-provider"] }
rsa = { version = "0.9", default-features = false, features = ["pem", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
tokio = { workspace = true }
webpki-roots = "1"

[dev-dependencies]
axum.workspace = true
base64 = "0.23"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { workspace = true, features = ["io-util", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
url = "2.5"
