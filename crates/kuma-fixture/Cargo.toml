[package]
name = "v1per-kuma-fixture"
version = "0.1.0"
description = "Deterministic synthetic Uptime Kuma 2.5.0 SQLite database for import tests"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.22"
bcrypt = "0.19"
brotli = "9"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde_json.workspace = true
thiserror = "2"

[dev-dependencies]
tempfile = "3"
