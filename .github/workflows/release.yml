name: Release

# Runs on release tags that `scripts/release.sh` creates: vYY.M.D-<short commit>, e.g.
# v26.10.19-010a9a6. Waits for CI on the release commit, builds the server and probe Docker
# images and the static `v1per-probe` binaries on a native runner per platform, and creates a
# GitHub release with the binaries attached, whose notes are the version's CHANGELOG.md
# section.
on:
  push:
    tags:
      - 'v*'

concurrency:
  # Not keyed on the ref: two releases building in parallel would race for the
  # `latest` tag.
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read

env:
  REGISTRY: ghcr.io/coderscantina

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag and extract release notes
        id: version
        run: |
          release="${GITHUB_REF_NAME#v}"
          version="${release%-*}"
          sha="${release##*-}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$release" = "$version" ] || [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match v$crate-<short commit>"
            exit 1
          fi
          if [ "$(git rev-parse --short="${#sha}" HEAD)" != "$sha" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name its commit $(git rev-parse --short HEAD)"
            exit 1
          fi
          awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section $version"
            exit 1
          fi
          {
            echo "release=$release"
            echo "version=$version"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

      # release.sh pushes main and the tag together, so CI is already running on this
      # commit. Publishing waits for it instead of running the same checks again.
      - name: Wait for CI on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 30); do
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::no CI run on $GITHUB_SHA. Push main before the tag."
            exit 1
          fi
          gh run watch "$run" -R "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null

  image:
    needs: check
    strategy:
      matrix:
        image: [v1per, v1per-probe]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: v1per
            file: Dockerfile
          - image: v1per-probe
            file: Dockerfile.probe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            V1PER_GIT_SHA=${{ needs.check.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The static agent for operators without Docker (decision 0011).
  probe-binary:
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
          sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          NAME: v1per-probe-${{ needs.check.outputs.version }}-linux-${{ matrix.arch }}
        run: |
          cargo build --locked --profile probe --target "$TARGET" -p v1per-probe
          mkdir dist
          cp "target/$TARGET/probe/v1per-probe" "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-binary-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [check, image, probe-binary]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # `digests-v1per-linux-*` does not match the probe's `digests-v1per-probe-linux-*`.
      - name: Download server digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests/v1per
          pattern: digests-v1per-linux-*
          merge-multiple: true

      - name: Download probe digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests/v1per-probe
          pattern: digests-v1per-probe-linux-*
          merge-multiple: true

      - name: Download probe binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: probe-binaries
          pattern: probe-binary-*
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-platform images
        working-directory: ${{ runner.temp }}/digests
        env:
          RELEASE: ${{ needs.check.outputs.release }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          for name in v1per v1per-probe; do
            image="$REGISTRY/$name"
            digests=()
            for digest in "$name"/*; do digests+=("$image@sha256:${digest#"$name"/}"); done
            docker buildx imagetools create \
              -t "$image:$RELEASE" -t "$image:$VERSION" -t "$image:latest" "${digests[@]}"
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: probe-binaries/*
