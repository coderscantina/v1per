name: Release

# Runs on release tags that `scripts/release.sh` creates: vYY.M.D-<short commit>, e.g.
# v26.10.19-010a9a6. Builds the Docker image and creates a GitHub release whose notes are
# the version's CHANGELOG.md section.
on:
  push:
    tags:
      - 'v*'

concurrency:
  # Not keyed on the ref: two releases building in parallel would race for the
  # `latest` tag.
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/coderscantina/v1per

jobs:
  # Publishing is gated on the same checks that run on pull requests.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag and extract release notes
        id: version
        run: |
          release="${GITHUB_REF_NAME#v}"
          version="${release%-*}"
          sha="${release##*-}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$release" = "$version" ] || [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match v$crate-<short commit>"
            exit 1
          fi
          if [ "$(git rev-parse --short="${#sha}" HEAD)" != "$sha" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name its commit $(git rev-parse --short HEAD)"
            exit 1
          fi
          awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section $version"
            exit 1
          fi
          {
            echo "release=$release"
            echo "version=$version"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.release }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            V1PER_GIT_SHA=${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
