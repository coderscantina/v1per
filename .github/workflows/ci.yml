name: CI

# Doc-only changes skip CI. CHANGELOG.md still runs it: a second release on the same day
# changes only that file, and the release workflow waits for CI on the release commit.
on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'CHANGELOG.md'
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'CHANGELOG.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: '1.4.3'
  CARGO_TERM_COLOR: always
  # A cached CI build is never incremental, and line tables keep backtraces readable at a
  # fraction of the full debug info's compile and link time.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      # Saved after failing runs too, so the DuckDB build is not repeated after a red test.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The ping check opens unprivileged ICMP sockets, which the runner forbids by default.
      - name: Allow unprivileged ping
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

      - name: Test
        run: cargo test --workspace --no-fail-fast

      - name: Check generated types
        run: cargo run -p v1per-protocol --bin export-types -- --check

  # Decision 0011: the static probe agent stays at most 15 MB.
  probe-size:
    name: Probe size
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
          rustup default stable
          sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: probe-musl

      - name: Build the static probe
        run: cargo build --locked --profile probe --target x86_64-unknown-linux-musl -p v1per-probe

      - name: Check its size
        run: |
          size=$(stat -c %s target/x86_64-unknown-linux-musl/probe/v1per-probe)
          echo "v1per-probe: $size bytes"
          if [ "$size" -gt 15000000 ]; then
            echo "::error::v1per-probe is $size bytes, over the 15 MB budget of decision 0011"
            exit 1
          fi

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
