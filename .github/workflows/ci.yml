name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Callable so the release workflow can gate publishing on the same checks.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'
  CARGO_TERM_COLOR: always

# The Rust workspace and the web app do not exist yet. Every step is guarded on
# the file that marks its scaffold, so CI stays green until they land.
jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        if: hashFiles('Cargo.toml') != ''
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache Cargo
        if: hashFiles('Cargo.toml') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all --check

      - name: Clippy
        if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace

      - name: Check generated types
        if: hashFiles('Cargo.toml') != ''
        run: cargo run -p v1per-protocol --bin export-types -- --check

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        if: hashFiles('apps/web/package.json') != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        if: hashFiles('apps/web/package.json') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        if: hashFiles('apps/web/package.json') != ''
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: hashFiles('apps/web/package.json') != ''
        run: bun run typecheck

      - name: Lint
        if: hashFiles('apps/web/package.json') != ''
        run: bun run lint

      - name: Test
        if: hashFiles('apps/web/package.json') != ''
        run: bun run test
