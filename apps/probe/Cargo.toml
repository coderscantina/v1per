[package]
name = "v1per-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "v1per-probe"
path = "src/main.rs"

[dependencies]
v1per-probe-core = { path = "../../crates/probe-core" }
v1per-protocol = { path = "../../crates/protocol" }
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1.5"
getrandom = { version = "0.3", features = ["std"] }
libc = "0.2"
# The client for the server; TLS through rustls with Mozilla's roots, like checks.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "signal", "sync", "time"] }
tracing = "0.1"
# Without env-filter: `Targets` parses `V1PER_LOG` without pulling in regex.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry", "ansi"] }
url = "2.5"
webpki-roots = "1"

[dev-dependencies]
axum.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
