[workspace]
members = ["apps/probe", "apps/server", "crates/*"]
resolver = "3"

[workspace.package]
version = "26.10.19"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
axum = "0.8"
duckdb = { version = "1.10506.0", features = ["bundled"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
ts-rs = "12"

# argon2 is deliberately slow; unoptimized it makes every test login take seconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
debug = "line-tables-only"

# libduckdb-sys defines NDEBUG only when the build has no debug info. Without it DuckDB keeps
# its internal assertions, which DuckDB's own releases compile out, and a failed one aborts
# the server where a release build returns an error.
[profile.release.package.libduckdb-sys]
debug = false

# The probe agent's release build (decision 0011): small and stripped, built with
# `cargo build --profile probe -p v1per-probe`.
[profile.probe]
inherits = "release"
debug = false
strip = true
lto = true
codegen-units = 1
